# ============================================================
# 云剪贴板 paste.example.com
#
# 部署步骤：
#   1. DNS 添加 A/AAAA 记录: paste -> 服务器 IP
#   2. 整个 cloud-clipboard 目录放到 /srv/clipboard/
#        (server.py / index.html / style.css / app.js)
#   3. 本文件放到 /etc/nginx/sites-enabled/paste.conf
#   4. 启动后端 (见 clipboard.service):
#        systemctl enable --now clipboard
#   5. nginx -t && systemctl reload nginx
#
# 说明：所有请求反向代理到本地 Python3 后端 (127.0.0.1:27150)，
#       文件大小限制 (100MB) 由后端 server.py 强制。
# ============================================================

server {
    listen 80;
    server_name paste.example.com;
    return 301 https://$host$request_uri;
    server_tokens off;
}

server {
    listen 443 ssl http2;
    server_name paste.example.com;
    server_tokens off;

    ssl_certificate     /etc/acme/example.com/fullchain.pem;
    ssl_certificate_key /etc/acme/example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # 文本不限长度，文件大小限制由后端强制执行
    client_max_body_size 0;
    client_body_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:27150;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
